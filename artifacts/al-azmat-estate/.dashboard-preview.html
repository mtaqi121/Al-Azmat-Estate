<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dashboard preview helper</title>
  </head>
  <body style="margin:0;overflow:hidden">
    <script>
      sessionStorage.setItem("alAzmatWelcomeSeen", "yes");
    </script>
    <iframe title="Collapsed sidebar preview" src="/" style="display:block;width:100vw;height:100vh;border:0"></iframe>
    <script>
      const preview = document.querySelector("iframe");
      preview.addEventListener("load", () => {
        preview.contentDocument.querySelector(".sidebar-toggle")?.click();
      });
    </script>
  </body>
</html>
